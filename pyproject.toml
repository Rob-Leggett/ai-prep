[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-prep"
version = "0.1.0"
description = "Local AI stack: CatBoost + RAG + FastAPI + MLflow + DuckDB"
readme = "README.md"
authors = [{ name = "Robert Leggett", email = "contact@robertleggett.com.au" }]
license = "MIT"
requires-python = ">=3.13"

dependencies = [
    # Core
    "pandas>=3.1.0",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",

    # Classic ML
    "catboost>=1.2.10",
    "shap>=0.54.1",

    # Tracking/registry
    "mlflow>=3.17.2",
    "cloudpickle>=3.1.2",

    # API
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",

    # Server
    "mcp[cli]>=2.3.0",

    # RAG + embeddings
    "sentence-transformers>=6.2.0",
    "faiss-cpu>=1.15.1",

    # LLMs & agents
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "openai>=3.37.0",

    # Lakehouse
    "duckdb>=2.0.0",
    "pyarrow>=25.0.1",  # mlflow 3.17 requires pyarrow<26

    # Ingestion & tokens
    "pypdf>=6.21.2",
    "tiktoken>=0.14.0",

    # Optional utils
    "python-dotenv>=1.2.4",
    "joblib>=1.6.0",

    # Notebooks & viz (optional)
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ruff>=0.17.2",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pip-audit>=2.10.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ml*", "rag*"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
